{{ define "main" }}
<div class="page-body my-10">
  <div class="max-w-prose mx-auto flex justify-center mb-6">
    <article class="prose prose-slate lg:prose-xl dark:prose-invert">
      <h1 class="lg:text-6xl">{{ .Title }}</h1>
      {{ .Content }}
    </article>
  </div>
  
  <div class="container max-w-[65ch] mx-auto px-4 space-y-6">
    {{ range .Pages }}
      <!-- This forces Hugo to use your custom citation partial -->
      {{ partial "views/citation.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
