hugoblox:
  branding:
    name: "Dr. Nodali Ndraha"
    navbar:
      show_logo: true
  # ---------------------------------------------------------------------------
  # 1. ACADEMIC IDENTITY & BRANDING
  # ---------------------------------------------------------------------------
  identity:
    name: Dr. Nodali Ndraha
    type: person
    organization: National Research and Innovation Agency (BRIN)
    tagline: Senior Researcher in Microbial Food Safety & Quantitative Risk Assessment
    description: >-
      Investigating foodborne pathogen dynamics, biofilm control, and fermentation
      ecology through molecular diagnostics (PMA-qPCR, MIRA) and quantitative
      microbial risk assessment (QMRA).
    social:
      twitter: nodaliX

  # ---------------------------------------------------------------------------
  # 2. APPEARANCE & THEME
  # ---------------------------------------------------------------------------
  theme:
    mode: system
    color: indigo # Matches your custom oklch primary palette
  
  appearance:
    plugins_css:
      - css/custom.css

  # ---------------------------------------------------------------------------
  # 3. HEADER & MOBILE NAVIGATION (FIXED INDENTATION)
  # ---------------------------------------------------------------------------
  header:
    enable: true
    style: navbar
    sticky: true
    navbar:
      enable: true
      align: r
      show_logo: true        # Renders "Dr. Nodali Ndraha" on the left of the navbar
      show_language: false
      show_day_night: true   # Dark/Light mode toggle
      show_search: true      # Enables Pagefind/Fuse quick search for publications
      highlight_active_link: true

  # ---------------------------------------------------------------------------
  # 4. PROFESSIONAL ACADEMIC FOOTER
  # ---------------------------------------------------------------------------
  footer:
    style: minimal
    language_switcher: false
    copyright:
      notice: "© {year} Dr. Nodali Ndraha. All rights reserved."
      license:
        enable: false

  # ---------------------------------------------------------------------------
  # 5. TECHNICAL CONTENT & CITATIONS
  # ---------------------------------------------------------------------------
  content:
    math:
      enable: true           # Enables KaTeX for QMRA equations and modeling posts
    citation_style: apa      # Standardized formatting for your Cite buttons

  # ---------------------------------------------------------------------------
  # 6. SEO & INSTITUTIONAL METADATA (PRIVACY-SAFE)
  # ---------------------------------------------------------------------------
  seo:
    title: "Dr. Nodali Ndraha | Microbial Food Safety & Quantitative Risk Assessment"
    location:
      address:
        street: Jl. Jogja - Wonosari Km 31.5, Playen
        city: Gunungkidul
        region: Special Region of Yogyakarta
        country: Indonesia
        postal_code: "55861"
      # Personal phone number removed to prevent bot scraping from JSON-LD schema

  # ---------------------------------------------------------------------------
  # 7. ANALYTICS, VERIFICATION & PRIVACY
  # ---------------------------------------------------------------------------
  analytics:
    google:
      measurement_id: G-VLTQ26MJLS
  verification:
    google: jM0cLIARDcKAUYnlBt4gGDiawxsTlTH5zNDt31BtVTg
  comments:
    enable: false
  privacy:
    enable: true
    anonymize_analytics: true

# =============================================================================
# HUGO BLOX v0.12.0 ROOT-LEVEL FALLBACKS
# Ensures Hugo Blox 0.12.0 partials read the navbar & branding settings properly
# =============================================================================
header:
  navbar:
    enable: true
    align: r
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: true

footer:
  copyright:
    notice: "© {year} Dr. Nodali Ndraha. Affiliated with the National Research and Innovation Agency."

features:
  math:
    enable: true
