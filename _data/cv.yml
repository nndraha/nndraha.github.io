        summary: Responsible for collecting, managing, and analyzing research data to support scientific studies and innovation. This role involves working with researchers to understand data needs, applying statistical and computational tools to analyze complex datasets, and creating clear reports and visualizations to communicate findings. The analyst also helps ensure data quality, supports scientific publications, and may provide training in data analysis methods. Their work supports evidence-based decision-making and contributes to the success of national research and innovation projects.

