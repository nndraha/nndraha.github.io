        summary: Focusing on supporting the management of food safety, my research aims to develop innovative strategies and tools to ensure the quality and safety of food products. By examining various aspects of food safety management, such as risk assessment, monitoring, and regulatory compliance, I strive to enhance the effectiveness and efficiency of food safety systems. Through this work, I aim to contribute to the protection of public health and the promotion of consumer confidence in the food supply.

